<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>

    <style>
        .header {
            background-color: chocolate;
            height: 60px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 100px;
            text-align: center;
            font-weight: bold;
        }

        .logo img {
            width: 100px;
            height: 80px;
        }

        .webname {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            background-color: antiquewhite;
            height: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .menu a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .left {
            width: 15%;
            text-align: center;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
        }

        .left a {
            text-decoration: none;
            color: blue;
            line-height: 40px;
        }

        .right {
            flex: 1;
            border: 1px solid black;
        }

        .right iframe {

            width: 100%;
            height: 100%;
            border: none;
        }

        .main {
            display: flex;
            height: 400px;
            background-color: rgb(252, 202, 141);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            <div class="logo img">
                <img src="logo.png" alt="college logo">
            </div>
        </div>

        <div class="webname">
            ONLINE BOOK STORE
        </div>
    </div>

    <hr>

    <div class="menu">
        <a href="home.html" target="content">HOME</a>
        <a href="login.html" target="content">LOGIN</a>
        <a href="registration.html" target="content">REGISTRATION</a>
        <a href="catalogue.html" target="content">CATALOGUE</a>
        <a href="cart.html" target="content">CART</a>
    </div>

    <hr>

    <div class="main">

        <div class="left">
            <a href="cse.html" target="content">CSE</a>
            <a href="EC.html" target="content">ECE</a>
            <a href="Mechanics.html" target="content">MECHANICS</a>
            <a href="maths.html" target="content">MATHS</a>
        </div>

        <div class="right">
            <iframe src="home.html" name="content"></iframe>
        </div>

    </div>

</body>

</html>
